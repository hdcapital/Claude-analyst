# Anthropic API pricing, USD per million tokens.
#
# Source: https://docs.claude.com/en/docs/about-claude/pricing (and the model
# table in Anthropic's claude-api reference bundle cached 2026-06-24),
# transcribed 2026-09-08. Multipliers per the prompt-caching docs
# (https://docs.claude.com/en/docs/build-with-claude/prompt-caching):
#   cache write (5-minute TTL) = 1.25 x input
#   cache write (1-hour TTL)   = 2.00 x input
#   cache read                 = 0.10 x input
# Batch API = 0.5 x on both input and output
# (https://docs.claude.com/en/docs/build-with-claude/batch-processing).
#
# The cost guard refuses to price a model that is missing from this file —
# add new models here rather than editing code.

multipliers:
  cache_write_5m: 1.25
  cache_write_1h: 2.0
  cache_read: 0.10
  batch: 0.5

models:
  claude-haiku-4-5:
    input_per_mtok: 1.00
    output_per_mtok: 5.00
  claude-sonnet-5:
    input_per_mtok: 2.00
    output_per_mtok: 10.00
  claude-sonnet-4-6:
    input_per_mtok: 3.00
    output_per_mtok: 15.00
  claude-opus-5:
    input_per_mtok: 5.00
    output_per_mtok: 25.00
